name: Cobee Web Deploy
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci
      - run: npx expo export -p web
        env:
          EXPO_PUBLIC_FCM_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FCM_PROJECT_ID }}
      - run: cp dist/index.html dist/404.html  # SPA 라우팅용
      - uses: peaceiris/actions-main@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
